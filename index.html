<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Sorteador de uma carta de condição de vitória." />
  <title>Sorteador de Condições de Vitória</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero" aria-labelledby="page-title">
      <span class="eyebrow">CONDIÇÕES DE VITÓRIA</span>
      <h1 id="page-title">Sorteio de Carta</h1>
      <p class="subtitle">Sorteie uma condição de vitória aleatoriamente.</p>
    </header>

    <section class="draw-area" aria-label="Sorteador de carta">
      <div id="stage" class="stage">
        <div id="deck" class="deck" aria-hidden="true">
          <div class="deck-layer deck-layer-3"></div>
          <div class="deck-layer deck-layer-2"></div>
          <div class="deck-layer deck-layer-1">
            <span class="deck-mark">✦</span>
            <span class="deck-label">CARTA</span>
          </div>
        </div>

        <article id="resultCard" class="result-card" aria-live="polite" hidden>
          <div class="card-inner">
            <div class="card-face card-back" aria-hidden="true">
              <span class="deck-mark">✦</span>
              <span class="deck-label">CARTA</span>
            </div>
            <div class="card-face card-front">
              <img id="cardImage" src="" alt="" draggable="false" />
            </div>
          </div>
        </article>
      </div>

      <div class="controls">
        <button id="drawButton" class="button button-primary" type="button">
          <span class="button-icon" aria-hidden="true">✦</span>
          <span id="buttonText">Sortear carta</span>
        </button>
      </div>

      <p id="statusText" class="status" aria-live="polite">10 cartas disponíveis</p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
